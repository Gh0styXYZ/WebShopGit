<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glow & Care</title>
    <link rel="stylesheet" href="style.css">
    <script src="cart.js"></script>
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">
                <h1 id="logo">Glow & Care</h1>
            </div>
            <ul class="nav-links">
                <li><a href="index.html" class="active">Hem</a></li>
                <li><a href="products.html">Produkter</a></li>
                <li><a href="aboutUs.html">Om Oss</a></li>
                <li><a href="contact.html">Kontakt</a></li>
            </ul>
            <div class="nav-icons">
                <a id="cart-icon" href="cart.html" style="position: relative; cursor: pointer;">
                    <img id="icons" src="Shopping cart.svg" alt="Shopping Cart">
                    <span id="cart-count" class="cart-badge">0</span>
                </a>
                <img id="icons" src="Search.svg" alt="Search Icon">
            </div>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h2>Naturlig skönhet & lyxig hudvård</h2>
            <h1>Stråla med Glow & Care</h1>
            <p>Upptäck de bästa produkterna för din skönhet.</p>
            <a href="products.html" class="btn hero-btn">Shoppa Nu</a>
        </div>
        <div class="hero-image">
        </div>
    </section>

    <section class="categories">
        <div class="category-card">
            <img src="MakeupProductImage.png" alt="Smink">
            <h3>Smink</h3>
            <a href="makeup.html" class="btn">Utforska</a>
        </div>
        <div class="category-card">
            <img src="SkincareProductImage.png" alt="Hudvård">
            <h3>Hudvård</h3>
            <a href="skincare.html" class="btn">Se Mer</a>
        </div>
        <div class="category-card">
            <img src="haircareProductImage.png" alt="Hårvård">
            <h3>Hårvård</h3>
            <a href="haircare.html" class="btn">Utforska</a>
        </div>
        <div class="category-card">
            <img src="NewsProductImage.png" alt="Nyheter">
            <h3>Nyheter</h3>
            <a href="products.html" class="btn">Nyheter</a>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Glow & Care. All rights reserved.</p>
    </footer>

</html>
